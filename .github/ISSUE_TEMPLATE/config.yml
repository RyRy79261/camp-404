# No blank issues: each form asks the few questions that otherwise take three
# rounds of "which screen?" and "what did you expect?".
blank_issues_enabled: false
contact_links:
  - name: Found a security or privacy problem?
    url: https://github.com/RyRy79261/camp-404/security/advisories/new
    about: Report it privately, never in a public issue. The app is live and holds real people's data. See SECURITY.md.
  - name: A camp member? Report from inside the app
    url: https://camp-404.com
    about: Sign in and shake your phone. The app removes personal details before it files the issue. This form does not.
