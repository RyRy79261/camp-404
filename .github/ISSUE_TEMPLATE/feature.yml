name: Feature or change request
description: Something the app should do that it does not do
labels: ["type: feature", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Much of the app is already planned (see `DEFERRED.md` and `docs/`).
        If you are not sure it is there, file it anyway.

  - type: textarea
    id: problem
    attributes:
      label: What is the problem?
      description: Who is stuck, and on what. Say which people you mean.
      placeholder: |
        A team lead cannot see who in their team has not paid dues, so they
        ask a captain every week.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What should happen instead?
    validations:
      required: false

  - type: dropdown
    id: who
    attributes:
      label: Who is it for?
      multiple: true
      options:
        - Camp members
        - Team leads
        - Captains
        - Whoever maintains the app
    validations:
      required: true

  - type: textarea
    id: real
    attributes:
      label: Has this happened to someone?
      description: |
        Optional. "A captain asked about this at the last meeting" counts for
        more than a guess.
    validations:
      required: false

  - type: checkboxes
    id: personal-data
    attributes:
      label: Before you post
      description: This repository is public.
      options:
        - label: Nothing above shows somebody else's personal details.
          required: true
        - label: Nothing above holds a token, key or password, also not inside a link.
          required: true
