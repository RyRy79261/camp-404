name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default: every job runs install scripts and build tooling,
# and none of them writes to the repository. A job that needs more says so.
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      src: ${{ steps.filter.outputs.src }}
      db: ${{ steps.filter.outputs.db }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            src:
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig*.json'
              - '.github/**'
            # The migration check needs a Neon branch, and the project's branch
            # limit is shared with every open PR's preview. Run it only when
            # what it applies can change: the migrations, the schema or the
            # migration tooling. The lockfile counts as tooling: it pins the
            # drizzle-kit and driver versions the job installs. Query code and
            # tests run in the test job.
            db:
              - 'packages/db/migrations/**'
              - 'packages/db/src/schema.ts'
              - 'packages/db/drizzle.config.ts'
              - 'packages/db/package.json'
              - 'pnpm-lock.yaml'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
        run: pnpm turbo run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
        run: pnpm turbo run typecheck
      - name: Verify drizzle migrations are up-to-date with packages/db/src/schema.ts
        run: |
          pnpm --filter @camp404/db exec drizzle-kit generate
          if [ -n "$(git status --porcelain packages/db/migrations/)" ]; then
            echo "::error::Drizzle migrations are out of date. Run 'pnpm --filter @camp404/db db:generate' locally and commit the result."
            git status --porcelain packages/db/migrations/
            git diff packages/db/migrations/ | head -100
            exit 1
          fi
          echo "packages/db/migrations/ is up-to-date with src/schema.ts"

  test:
    needs: [changes]
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
        # Coverage floors live in each package's vitest.config.ts; a package
        # that drops below its floor fails this job.
        run: pnpm turbo run test:coverage

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml', 'apps/web/next.config.*') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-
      - name: Build
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
        run: pnpm turbo run build

  schema-migration:
    # Apply the committed Drizzle migration SQL to a fresh ephemeral Neon
    # branch per PR run. Catches schema-vs-Postgres drift that static
    # freshness checks cannot (bad CHECK syntax, cross-schema FK
    # permissions, unreachable target tables). Each run gets its own
    # branch so concurrent PRs don't collide; cleanup runs unconditionally
    # to keep branch usage bounded.
    needs: [changes]
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create Neon test branch
        id: neon-branch
        uses: neondatabase/create-branch-action@v5
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch_name: ci-schema-${{ github.run_id }}
      - name: Apply Drizzle migrations
        env:
          DATABASE_URL: ${{ steps.neon-branch.outputs.db_url }}
        run: pnpm --filter @camp404/db db:migrate
      - name: Delete Neon test branch
        if: always()
        uses: neondatabase/delete-branch-action@v3
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch: ci-schema-${{ github.run_id }}

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --audit-level high

  # Playwright e2e suite. Self-contained: playwright.config.ts auto-starts
  # `next dev` with E2E_TEST_MODE=1, which bypasses the login and the Neon
  # database with the in-memory test store (apps/web/lib/test-store.ts). So
  # this job needs no Vercel preview, no DATABASE_URL, and no auth secret —
  # the build-time placeholders (packages/auth/src/config.ts and
  # packages/db/src/index.ts) carry module load, and every test-mode path
  # reads/writes the in-memory store instead.
  e2e:
    needs: [changes]
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    # Two shards, each with its own `next dev` and in-memory store, so the
    # serial rule in playwright.config.ts still holds inside each. One server
    # compiling every route the whole suite visits starved the runner at about
    # test 90 (three "The runner has received a shutdown signal" deaths on PR
    # #262, same point each time, three Azure regions).
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browser + system deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @camp404/web exec playwright install --with-deps chromium
      - name: Install Playwright system deps (cached browser)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @camp404/web exec playwright install-deps chromium
      - name: Run e2e tests
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
        # Desktop only; the 360 px project runs nightly (mobile.yml).
        # A memory line every 20 s leaves evidence if a runner dies mid-run.
        run: |
          ( while sleep 20; do
              echo "[mem $(date -u +%T)] $(free -m | awk '/Mem:/{print "used="$3"MB avail="$7"MB"} /Swap:/{print "swap="$3"MB"}' | tr '\n' ' ')top: $(ps -eo rss=,comm= --sort=-rss | head -3 | awk '{printf "%s=%dMB ", $2, $1/1024}')"
            done ) &
          pnpm --filter @camp404/web test:e2e --shard=${{ matrix.shard }}
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: apps/web/playwright-report/
          retention-days: 7

  # The real-database Playwright run (apps/web playwright.db.config.ts): the
  # questionnaire engine and the year rollover, which the in-memory store
  # cannot run (owner's call E2E-DB). Postgres and the local Neon proxy run as
  # service containers, so it needs no Neon branch and no secrets.
  # join.camp-404.com's smoke test (apps/join): the boot skips, an icon opens
  # its window, Esc closes it, APPLY links to the form. The site is static, so
  # this needs no database and no secrets.
  e2e-join:
    needs: [changes]
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browser + system deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @camp404/join exec playwright install --with-deps chromium
      - name: Install Playwright system deps (cached browser)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @camp404/join exec playwright install-deps chromium
      - name: Run join smoke tests
        run: pnpm --filter @camp404/join test:e2e

  e2e-db:
    needs: [changes]
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: main
        options: >-
          --health-cmd "pg_isready -U postgres -d main"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      neon-proxy:
        image: ghcr.io/timowilhelm/local-neon-http-proxy:main
        env:
          PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/main
        ports:
          - 4444:4444
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browser + system deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @camp404/web exec playwright install --with-deps chromium
      - name: Install Playwright system deps (cached browser)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @camp404/web exec playwright install-deps chromium
      - name: Migrate the service database
        # The proxy container can take a moment after Postgres is healthy.
        run: |
          for attempt in 1 2 3 4 5 6; do
            pnpm db:local:migrate && exit 0
            sleep 5
          done
          exit 1
      - name: Run real-database e2e tests
        run: pnpm --filter @camp404/web test:e2e:db
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-db
          path: apps/web/playwright-report-db/
          retention-days: 7

  # Commit messages on a PR follow commitlint.config.mjs. Only the PR's own
  # commits are checked (base..head); merge commits are ignored.
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  ci-pass:
    if: always()
    needs:
      [
        changes,
        lint,
        typecheck,
        test,
        build,
        e2e,
        e2e-join,
        e2e-db,
        schema-migration,
        supply-chain,
        commitlint,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          echo "=== Unconditional jobs ==="
          echo "changes: ${{ needs.changes.result }}"
          echo "lint: ${{ needs.lint.result }}"
          echo "typecheck: ${{ needs.typecheck.result }}"
          echo "build: ${{ needs.build.result }}"
          echo "supply-chain: ${{ needs.supply-chain.result }}"

          # Unconditional jobs: must succeed
          if [[ "${{ needs.changes.result }}" != "success" ||
                "${{ needs.lint.result }}" != "success" ||
                "${{ needs.typecheck.result }}" != "success" ||
                "${{ needs.build.result }}" != "success" ||
                "${{ needs.supply-chain.result }}" != "success" ]]; then
            echo "::error::Unconditional job failed"
            exit 1
          fi

          echo "=== Gated jobs (success or skipped) ==="
          echo "test: ${{ needs.test.result }}"
          echo "e2e: ${{ needs.e2e.result }}"
          echo "e2e-join: ${{ needs.e2e-join.result }}"
          echo "e2e-db: ${{ needs.e2e-db.result }}"
          echo "schema-migration: ${{ needs.schema-migration.result }}"
          echo "commitlint: ${{ needs.commitlint.result }}"

          # Gated jobs: success OR skipped
          for result in \
            "${{ needs.test.result }}" \
            "${{ needs.e2e.result }}" \
            "${{ needs.e2e-join.result }}" \
            "${{ needs.e2e-db.result }}" \
            "${{ needs.schema-migration.result }}" \
            "${{ needs.commitlint.result }}"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::Gated job failed (not success or skipped): $result"
              exit 1
            fi
          done

          echo "All jobs passed"
