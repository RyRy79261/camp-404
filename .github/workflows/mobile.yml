name: Mobile e2e (nightly)

# The whole Playwright suite at 360 px wide, the narrowest phone the boards
# draw for. Nightly, not on every PR: it doubles the e2e run, and a phone-only
# break is rarely urgent enough to block a merge. Run it by hand from the
# Actions tab before a release.
on:
  schedule:
    # 02:00 in Cape Town (UTC+2).
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: mobile-e2e
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile-360:
    runs-on: ubuntu-latest
    # The PR e2e job's set-up (ci.yml), at 360 px: a production build served
    # by `next start` (E2E_SERVE_BUILD=1), in two shards. Under `next dev`
    # Turbopack's memory grew until the runner was killed ("The runner has
    # received a shutdown signal"), which is how this run failed every night
    # from 2026-09-29.
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browser + system deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @camp404/web exec playwright install --with-deps chromium
      - name: Install Playwright system deps (cached browser)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @camp404/web exec playwright install-deps chromium
      - name: Build the app for e2e
        # The test env the server gets from playwright.config.ts's
        # webServer.env, as in ci.yml's e2e job. CI=true (set by Actions) is
        # what lets lib/env.ts start a production server with E2E_TEST_MODE.
        env:
          E2E_TEST_MODE: "1"
          INVITE_CODES: test-invite-e2e-only-code
          GOD_EMAILS: god@example.com
          PRINCE_KEEPER_EMAILS: prince-keeper@example.com
        run: pnpm --filter @camp404/web build
      - name: Run e2e tests at 360 px
        env:
          E2E_SERVE_BUILD: "1"
        # A memory line every 20 s leaves evidence if a runner dies mid-run.
        run: |
          ( while sleep 20; do
              echo "[mem $(date -u +%T)] $(free -m | awk '/Mem:/{print "used="$3"MB avail="$7"MB"} /Swap:/{print "swap="$3"MB"}' | tr '\n' ' ')top: $(ps -eo rss=,comm= --sort=-rss | head -3 | awk '{printf "%s=%dMB ", $2, $1/1024}')"
            done ) &
          pnpm --filter @camp404/web test:e2e:mobile --shard=${{ matrix.shard }}
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-mobile-360-${{ strategy.job-index }}
          path: apps/web/playwright-report/
          retention-days: 7
